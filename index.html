<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CForge – Master C by seeing memory</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b14;--panel:#0b1626;--line:#173049;--ink:#e6f4ff;--mute:#8fb0c7;--cy:#00ffc8;--bl:#00b3ff;--or:#ff7a00;--rd:#ff3b5c;--pu:#a66bff;
--ui:"Space Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--ui);min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
/* 3D buttons */
.b3{border:0;padding:12px 22px;border-radius:12px;font-weight:700;color:#00141c;background:linear-gradient(135deg,var(--cy),var(--bl));box-shadow:0 6px 0 #00806a,0 12px 24px rgba(0,255,200,.25);transition:transform .15s,box-shadow .15s}
.b3:hover{transform:translateY(-3px);box-shadow:0 9px 0 #00806a,0 18px 32px rgba(0,255,200,.4)}
.b3:active{transform:translateY(5px);box-shadow:0 1px 0 #00806a}
.b3.or{background:linear-gradient(135deg,#ffb347,var(--or));box-shadow:0 6px 0 #a34d00,0 12px 24px rgba(255,122,0,.25)}
.b3.or:hover{box-shadow:0 9px 0 #a34d00,0 18px 32px rgba(255,122,0,.4)}
.b3.or:active{box-shadow:0 1px 0 #a34d00}
.b3.pu{background:linear-gradient(135deg,#c9a4ff,var(--pu));box-shadow:0 6px 0 #5a2fa6}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--mute)}
.ghost:hover,.ghost.on{border-color:var(--cy);color:var(--cy)}
/* entry */
#enter{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#08233a,#02060c 70%);overflow:hidden;transition:transform .9s cubic-bezier(.7,0,.3,1),opacity .9s}
#enter.go{transform:scale(3);opacity:0;pointer-events:none}
.floor{position:absolute;left:-50%;right:-50%;bottom:-10%;height:60%;background-image:linear-gradient(rgba(0,255,200,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,200,.18) 1px,transparent 1px);background-size:56px 56px;transform:perspective(420px) rotateX(68deg);animation:fl 5s linear infinite;mask-image:linear-gradient(transparent,#000 60%)}
@keyframes fl{to{background-position:0 56px}}
.sym{position:absolute;font-family:var(--mono);color:var(--cy);opacity:.4;text-shadow:0 0 14px var(--cy);animation:fy 7s ease-in-out infinite}
@keyframes fy{50%{transform:translateY(-26px) rotate(7deg)}}
.scene{perspective:700px;width:120px;height:120px;margin:0 auto 20px;position:relative;z-index:2}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:rot 9s linear infinite}
@keyframes rot{to{transform:rotateX(360deg) rotateY(360deg)}}
.cube i{position:absolute;inset:0;display:grid;place-items:center;font:700 54px var(--mono);font-style:normal;color:var(--cy);border:2px solid var(--cy);background:rgba(0,255,200,.07);box-shadow:inset 0 0 24px rgba(0,255,200,.3),0 0 20px rgba(0,255,200,.2)}
.cube i:nth-child(1){transform:translateZ(60px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(60px)}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(60px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(60px)}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(60px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(60px)}
#enter h1{font-size:clamp(2.4rem,8vw,4.5rem);letter-spacing:.04em;position:relative;z-index:2}
#enter p.t{color:var(--mute);max-width:34ch;margin:8px auto 24px;position:relative;z-index:2}
#boot{font:13px var(--mono);color:#7ef9dd;min-height:20px;margin-top:20px;position:relative;z-index:2}
/* app */
#app{display:none}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;align-items:center;overflow-x:auto;padding:10px 14px;background:rgba(5,11,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav b{font:700 18px var(--mono);color:var(--cy);margin-right:8px;white-space:nowrap}
nav a{color:var(--mute);text-decoration:none;padding:6px 12px;border-radius:8px;white-space:nowrap;font-size:14px}
nav a.on{background:var(--panel);color:var(--cy)}
main{max-width:980px;margin:0 auto;padding:20px 16px 90px}
h2{font-size:1.6rem;margin-bottom:12px}h3{font-size:1.1rem;margin:16px 0 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat b{display:block;font:700 2rem var(--mono);color:var(--cy)}.stat span{color:var(--mute);font-size:13px}
.bar{height:8px;background:#0e2236;border-radius:9px;overflow:hidden;margin-top:8px}.bar div{height:100%;background:linear-gradient(90deg,var(--cy),var(--bl));transition:width .6s}
pre,code{font-family:var(--mono)}pre{background:#030810;border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;font-size:13.5px;line-height:1.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.lvl{margin:18px 0 8px;color:var(--bl);font-weight:700}
.days{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.dn{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font:700 16px var(--mono);text-decoration:none;color:var(--mute);transform:perspective(300px) rotateX(14deg);transition:transform .2s}
.dn:hover{transform:perspective(300px) rotateX(0) translateY(-4px)}
.dn.done{background:rgba(0,255,200,.14);border-color:var(--cy);color:var(--cy);box-shadow:0 0 16px rgba(0,255,200,.25)}
.dn.cur{border-color:var(--or);color:var(--or);animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 18px rgba(255,122,0,.6)}}
.phase{display:flex;gap:6px;margin:10px 0}.phase span{flex:1;font-size:11px;text-align:center;padding:6px 2px;border-radius:8px;background:#0a1828;color:var(--mute)}.phase span.on{background:var(--cy);color:#00141c;font-weight:700}
.tm{font:700 2.4rem var(--mono)}
.q button{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#08121f}
.q button.ok{border-color:var(--cy);background:rgba(0,255,200,.12)}.q button.no{border-color:var(--rd);background:rgba(255,59,92,.12)}
/* memory */
.mem{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zone{min-height:150px}.zone h3{margin-top:0;font-size:.95rem;color:var(--mute)}
.box{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font:13px var(--mono);display:flex;justify-content:space-between;gap:8px;background:#08121f;transition:.3s}
.box small{color:var(--mute)}.box.tgt{border-color:var(--pu);box-shadow:0 0 14px rgba(166,107,255,.6)}.box.ptr b{color:var(--pu)}.box.freed{border-color:var(--rd);opacity:.55;text-decoration:line-through}
.line{display:block;padding:0 6px;border-radius:5px}.line.on{background:rgba(0,179,255,.25)}
.note{margin-top:10px;padding:10px 12px;border-radius:10px;background:#08121f;border-left:3px solid var(--bl)}.note.w{border-color:var(--rd);background:rgba(255,59,92,.1)}
/* guru */
#chat{height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.m{padding:9px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap}.m.u{align-self:flex-end;background:#12385a}.m.g{background:#0e2236;border:1px solid var(--line)}
input[type=text]{flex:1;min-width:0;background:#030810;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--ink);font:inherit}
.hint{color:var(--mute);font-size:13px}
:root[data-theme=light]{--bg:#f2f8fd;--panel:#fff;--line:#c9dcec;--ink:#0a1a2a;--mute:#47627a;--cy:#007a63;--bl:#0069b3;--or:#c75a00;--pu:#7a3fd1;color-scheme:light}
[data-theme=light] pre,[data-theme=light] input[type=text],[data-theme=light] .code,[data-theme=light] .box,[data-theme=light] .note,[data-theme=light] .q button,[data-theme=light] .m.g,[data-theme=light] .phase span,[data-theme=light] .bar{background:#eaf2f9}
[data-theme=light] nav{background:rgba(242,248,253,.92)}[data-theme=light] .b3{color:#fff}[data-theme=light] .m.u{background:#cfe6fb}[data-theme=light] .dn.done{background:rgba(0,122,99,.12)}
.code{width:100%;min-height:210px;background:#030810;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:13.5px/1.6 var(--mono);resize:vertical;tab-size:2}
.out{white-space:pre-wrap;min-height:70px}.out.err{border-color:var(--rd)}.out.ok{border-color:var(--cy)}
.hero{background:radial-gradient(circle at 85% 0,rgba(0,179,255,.22),transparent 55%),var(--panel)}.hero svg{width:100%;height:auto;margin:6px 0}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin:2px 4px 0 0}
.mod{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}.mod:hover{border-color:var(--cy)}.mod i{font:700 1.3rem var(--mono);font-style:normal;color:var(--cy);min-width:2.2ch}
@media (max-width:560px){.mem{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const T=["Setup & Hello World","Variables & types","printf & scanf","Operators","if / else","switch","Loops","Nested loops & patterns","Functions","Project: Calculator",
"Arrays","2D arrays","Strings","String functions","Memory addresses","Pointers","Pointer arithmetic","Pointers & arrays","Pass by reference","Stack vs heap","malloc & free","Project: String library",

const LV=[["Level 1 · C foundations",1,10],["Level 2 · Memory thinking",11,22],["Level 3 · Data & structures",23,36],["Level 4 · Real C engineering",37,48],["Level 5 · Systems projects",49,60]];
const D={
1:{en:"Every C program starts at main(). The compiler turns your text into machine code, then you run it.",ta:"C program main()-la start aagum. Compiler unga code-a machine code-a maathi, apram run aagum.",code:'#include <stdio.h>\nint main(void){\n  printf("Hello, C!\\n");\n  return 0;\n}',q:["Where does a C program start running?",["main()","printf()","#include"],0]},
2:{en:"A variable is a named box in memory. Its type decides how many bytes the box has: int is usually 4, char is 1.",ta:"Variable-nu sonna memory-la oru peyar vechcha box. Type-a poruththu box size maarum: int = 4 bytes, char = 1 byte.",code:'int age = 20;\nchar grade = \'A\';\nprintf("%d %c", age, grade);',q:["Which specifier prints an int?",["%d","%c","%s"],0]},
5:{en:"if checks a condition. Zero is false; any other value is true. Use == to compare, not =.",ta:"if condition check pannum. 0 = false, mathathellam true. Compare panna == use pannunga, = illa.",code:'if (n % 2 == 0) printf("even");\nelse printf("odd");',q:["Which compares two values?",["=","==","=>"],1]},
7:{en:"A loop repeats work. for is best when you know the count; while when you only know the stop condition.",ta:"Loop oru velaya thirumba thirumba pannum. Count theriyum-na for, condition mattum theriyum-na while.",code:'for (int i = 1; i <= 5; i++)\n  printf("%d ", i);',q:["How many times does for(i=0;i<3;i++) run?",["2","3","4"],1]},

const P={
ptr:{name:"Pointer basics",code:["int x = 10;","int *p = &x;","*p = 99;"],steps:[
 {l:0,st:[{n:"x",v:10,a:"0x1000"}],n:"x is created on the stack and holds 10."},
 {l:1,st:[{n:"x",v:10,a:"0x1000"},{n:"p",v:"0x1000",a:"0x1004",to:"x"}],n:"p stores the address of x. It points at x."},

 {l:0,st:[{n:"p",v:"0x2000",a:"0x1000",to:"h"}],h:[{id:"h",a:"0x2000",v:"?"}],n:"malloc reserves 4 bytes on the heap. p holds its address."},
 {l:1,st:[{n:"p",v:"0x2000",a:"0x1000",to:"h"}],h:[{id:"h",a:"0x2000",v:42}],n:"42 is written into the heap block."},

leak:{name:"Bug: memory leak",code:["int *p = malloc(4);","p = malloc(8);   // lost first block"],steps:[

[/segfault|segmentation|crash/,"A segfault means you touched memory you don’t own. Check: NULL pointers, array index past the end, use after free, a missing & in scanf.","Segfault-nu sonna unga-ku sondham illaatha memory-a touch pannuteenga. NULL pointer, array index over, free-kku apram use, scanf-la & marandhathu — ivatha check pannunga."],

function chk(code){const er=[];if(!/#include\s*<stdio\.h>/.test(code))er.push("Add #include <stdio.h> at the top.");if(!/main\s*\(/.test(code))er.push("Your program needs a main() function.");
 code.split("\n").forEach((l,i)=>{const t=l.trim(),n="Line "+(i+1)+": ";if(/^(int|float|double|char)\s+[^;{()]+$/.test(t)||/^(printf|scanf|return)\b.*[^;{]$/.test(t))er.push(n+"missing ; at the end.");
  const m=t.match(/scanf\s*\(\s*"[^"]*"\s*,(.*)\)/);if(m&&m[1].split(",").some(a=>!/^\s*&/.test(a)))er.push(n+"scanf needs & before the variable, like &age.")});return er}
function exec(code,inp){const env={},nums=inp.split(/\s+/).filter(Boolean).map(Number);let ni=0,out="";
 const c=code.replace(/\/\/.*$/gm,"").replace(/\/\*[\s\S]*?\*\//g,"");
 const ev=e=>{const s=e.replace(/[a-zA-Z_]\w*/g,v=>v in env?env[v]:"NaN");if(!/^[\d\s+\-*/%().NaN]+$/.test(s))throw 0;return Function("return "+s)()};
 const re=/scanf\s*\(\s*"[^"]*"\s*,([^;]*)\)\s*;|printf\s*\(\s*"((?:[^"\\]|\\.)*)"\s*(?:,([^;]*))?\)\s*;|\b(?:int|float|double)?\s*([a-zA-Z_]\w*)\s*=\s*([^;=]+);/g;let m;
 while((m=re.exec(c))){if(m[1]!==undefined)m[1].split(",").forEach(a=>{env[a.replace(/[&\s]/g,"")]=nums[ni++]});
  else if(m[2]!==undefined){const ar=m[3]?m[3].split(",").map(a=>ev(a.trim())):[];let k=0;out+=m[2].replace(/%[di]|%f/g,s=>{const v=ar[k++];return s==="%f"?(+v).toFixed(6):String(Math.trunc(v))}).replace(/\\n/g,"\n").replace(/\\t/g,"\t").replace(/\\"/g,'"')}
  else env[m[4]]=ev(m[5])}return out}
